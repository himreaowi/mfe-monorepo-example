# EXAMPLE (not used by the image): the reverse proxy in front of a zone with several shells on
# one domain, e.g. portal.example.sg with the citizen shell at /citizen and the business shell
# at /business (package.json mfe.basePath). Each shell is its own container built from
# deploy/Dockerfile (--build-arg APP=@org/shell-citizen, ...): it serves every file below its
# base path and sends its own CSP, so this proxy routes by path WITHOUT rewriting it and
# passes the shells' headers through. Your ingress / load balancer / API gateway does the same
# with its own syntax. See deploy/README.md, "Several shells on one domain".

upstream shell_citizen {
    server shell-citizen:8080;
}
upstream shell_business {
    server shell-business:8080;
}

server {
    listen 443 ssl;
    server_name portal.example.sg;
    # ssl_certificate ...; ssl_certificate_key ...;

    # "/" has no shell: send visitors to the zone's default shell (root package.json
    # mfe.zones.internet.defaultShell, the dev proxy does the same).
    location = / {
        return 302 /citizen/;
    }

    # Each shell under its base path (prefix match, path kept as is).
    location = /citizen {
        return 301 /citizen/;
    }
    location /citizen/ {
        proxy_pass http://shell_citizen;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /business {
        return 301 /business/;
    }
    location /business/ {
        proxy_pass http://shell_business;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Each shell's BFF (sign-in, session) also lives below the shell's path and scopes its
    # session cookie to it (Path=/citizen, Path=/business, or distinct cookie names), so a
    # Singpass session of /citizen is never sent to /business and the other way round.
    # location /citizen/bff/  { proxy_pass http://bff-citizen:8080; }
    # location /business/bff/ { proxy_pass http://bff-business:8080; }

    location / {
        return 404;
    }
}
