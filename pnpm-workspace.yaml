packages:
  # apps/<zone>/<shell>/{shell,<remote>} and apps/<zone>/shared/<remote> (tools/scripts/src/layout.js)
  - apps/*/*/*
  - packages/*
  - tools/*

# Isolated layout: every app/package gets its own node_modules with only its declared deps (D7).
nodeLinker: isolated
hoistPattern: []
publicHoistPattern: []

# In pnpm 12 `manual` = use `catalog:` when the package is in the catalog, otherwise write a normal
# semver range to the app's package.json (tier 3). `prefer` would ADD every new dependency to the
# catalog. See docs/toolchain.md.
catalogMode: manual

# Dependencies allowed to run install scripts (pnpm 12 blocks all others and fails install).
allowBuilds:
  nx: true
  # Prebuilt binaries come as optional dependencies; their install scripts are not needed.
  '@parcel/watcher': false
  '@swc/core': false
  unrs-resolver: false
  # Storybook (dev only) bundles with esbuild; its binary comes as an optional dependency.
  esbuild: false

# react-router's .d.ts files import 'react' but it does not declare @types/react. In the isolated
# layout TypeScript then walks up past the repo and may pick up a stray @types/react (e.g. v18 in
# ~/node_modules). Declaring it as an optional peer links the catalog @types/react next to it.
packageExtensions:
  react-router:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  # @module-federation/enhanced depends on its rspack plugin, which lists @rspack/core as a required
  # peer. We build with webpack only; optional keeps pnpm from auto-installing Rspack.
  '@module-federation/rspack':
    peerDependenciesMeta:
      '@rspack/core':
        optional: true
  # @nx/eslint-plugin (enforce-module-boundaries) requires 'typescript' without declaring it.
  # In the isolated layout it is then not found. Declaring the peer links the catalog version.
  '@nx/eslint-plugin':
    peerDependencies:
      typescript: '*'

# Default catalog. Tier 1 (core singletons, shared via MF) + toolchain + tier 2 (common libs).
catalog:
  # tier 1
  react: 19.3.1
  react-dom: 19.3.1
  react-router: 8.4.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # toolchain
  '@eslint/js': 10.0.1
  '@nx/eslint-plugin': 23.3.0
  '@module-federation/enhanced': 2.9.2
  '@types/node': 24.19.2
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-prettier: 5.5.7
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
  nx: 23.3.0
  prettier: 3.9.10
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  # build (webpack-config, pwa)
  webpack: 5.111.1
  webpack-cli: 7.2.3
  webpack-dev-server: 6.1.0
  swc-loader: 0.2.7
  mini-css-extract-plugin: 2.10.2
  html-webpack-plugin: 5.6.8
  copy-webpack-plugin: 14.0.0
  terser-webpack-plugin: 5.6.1
  css-minimizer-webpack-plugin: 8.0.0
  lightningcss: 1.33.0
  css-loader: 7.1.5
  sass: 1.105.1
  sass-loader: 17.0.1
  workbox-build: 7.4.1
  # test (jest-config)
  '@swc/core': 1.16.18
  '@swc/jest': 0.2.39
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  '@types/jest': 30.0.0
  identity-obj-proxy: 3.0.0
  jest: 30.5.2
  jest-environment-jsdom: 30.5.2
  # e2e (playwright-config, generated shells)
  '@axe-core/playwright': 4.14.0
  '@playwright/test': 1.64.1
  # Storybook for @org/ui (dev only: never a dependency of an app, never in an app bundle)
  storybook: 10.6.2
  '@storybook/react-webpack5': 10.6.2
  # mf-runtime (manifest validator codegen, dev only)
  ajv: 8.20.0
  # tools/scripts (reads pnpm-workspace.yaml)
  yaml: 2.9.1
