<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What is inside the monorepo</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --paper: #f1f5f4; --ink: #0f172a; --muted: #475569; }
body { font-family: 'Geist', system-ui, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
.frame { max-width: 1280px; width: 100%; }
.diagram-container { width: 100%; overflow-x: auto; }
.eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
h1 { font-family: 'Instrument Serif', 'Noto Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2.25rem); font-weight: 400;
  letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.5rem; }
.lead { color: var(--muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
svg { width: 100%; min-width: 1280px; display: block; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Layer stack · What is inside</p>
<h1>What is inside the monorepo</h1>
<p class="lead">Five layers. Each layer uses the ones below it. Apps sit on top; one shared deploy setup sits at the bottom.</p>
<div class="diagram-container">
<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
<title id="layers-title">What is inside the monorepo</title>
<desc id="layers-desc">Layer stack of the monorepo: apps use shared packages, which use tools and safety checks, which run on one workspace with one version list and task runner, with one shared deploy setup at the bottom.</desc>
<defs>
<marker id="layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
<marker id="layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
<marker id="layers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f1f5f4"/>
<text x="148" y="88" fill="#556072" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">USES</text>
<line x1="148" y1="100" x2="148" y2="526" stroke="#475569" stroke-width="1.2" marker-end="url(#layers-arrow)"/>
<rect x="200" y="96" width="920" height="88" fill="#f1f5f4"/>
<rect x="200" y="96" width="920" height="88" fill="#ffffff" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
<text x="224" y="143.0" fill="#556072" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">APPS</text>
<text x="340" y="146.0" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Your apps: shells and remotes</text>
<text x="1096" y="145.0" fill="#475569" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">apps/intranet/* · apps/internet/*</text>
<rect x="200" y="184" width="920" height="88" fill="#f1f5f4"/>
<rect x="200" y="184" width="920" height="88" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
<text x="224" y="231.0" fill="#556072" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">PACKAGES</text>
<text x="340" y="234.0" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Shared code every app reuses</text>
<text x="1096" y="233.0" fill="#475569" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">@org/ui · auth · mf-runtime · http-client</text>
<rect x="200" y="272" width="920" height="88" fill="#f1f5f4"/>
<rect x="200" y="272" width="920" height="88" fill="#ffffff" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
<text x="224" y="319.0" fill="#556072" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">TOOLS</text>
<text x="340" y="322.0" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Generators and safety checks</text>
<text x="1096" y="321.0" fill="#475569" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">pnpm gen:* · pnpm check · mock API</text>
<rect x="200" y="360" width="920" height="88" fill="#f1f5f4"/>
<rect x="200" y="360" width="920" height="88" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
<text x="224" y="407.0" fill="#556072" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">WORKSPACE</text>
<text x="340" y="410.0" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">One version list, one task runner</text>
<text x="1096" y="409.0" fill="#475569" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">pnpm catalog · Nx builds only what changed</text>
<rect x="200" y="448" width="920" height="88" fill="#f1f5f4"/>
<rect x="200" y="448" width="920" height="88" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1.2"/>
<text x="224" y="495.0" fill="#0f766e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">DEPLOY</text>
<text x="340" y="498.0" fill="#0f172a" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">One deploy setup for every app</text>
<text x="1096" y="497.0" fill="#475569" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">nginx.conf + Dockerfile · manifest per env</text>
<rect x="200" y="96" width="920" height="440" fill="none" stroke="#475569" stroke-width="1"/>
<text x="640" y="600" fill="#475569" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">Change nginx once, in deploy/, and every app picks it up on its next build.</text>
</svg>
</div>
</div>
</body>
</html>
