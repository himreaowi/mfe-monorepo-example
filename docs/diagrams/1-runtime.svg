<svg width="1280" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-title runtime-desc">
<title id="runtime-title">How the portal works in the browser</title>
<desc id="runtime-desc">The browser opens the portal shell, which reads the remote list and loads the Services, My profile and Payments remotes; Payments mounts an outside vendor module and the shell signs users in through the backend sign-in service.</desc>
