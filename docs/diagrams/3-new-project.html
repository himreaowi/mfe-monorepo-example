.lead { color: var(--muted); max-width: 60ch; margin-bottom: 1.5rem; line-height: 1.5; }
svg { width: 100%; min-width: 1280px; display: block; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

<p class="eyebrow">Flow · Getting started</p>
<h1>Starting a new project from the template</h1>
<p class="lead">Copy the template once into a new repo. From then on it is your project: add apps, run them, push. You can still pull template fixes later if you want.</p>
